# ==============================================================================
# Vehicle Registration System (VRS) - Database Configuration
# ==============================================================================

# Database Provider: oracle (primary) or h2 (offline fallback)
db.type=oracle

# Oracle Database Connection Settings
db.driver=oracle.jdbc.OracleDriver
db.url=jdbc:oracle:thin:@localhost:1521:XE
db.username=system
db.password=oracle

# Alternative URLs for Oracle 21c/23c Free or custom services:
# db.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1
# db.url=jdbc:oracle:thin:@localhost:1521/XEPDB1

# Fallback Mode:
# When true, if the Oracle server is not reachable, the system automatically
# initializes an embedded database preloaded with the migrated Oracle dataset
# so testing and GUI features remain fully functional offline.
db.fallback.enabled=true

